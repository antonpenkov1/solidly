name: Tummi
options:
  bundleIdPrefix: com.antonpenkov
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_EMIT_LOC_STRINGS: YES
schemes:
  Tummi:
    build:
      targets:
        Tummi: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TummiTests
        - TummiUITests
    archive:
      config: Release
targets:
  Tummi:
    type: application
    platform: iOS
    sources:
      - Tummi
    dependencies:
      - target: TummiWidget
    info:
      path: Tummi/Info.plist
      properties:
        CFBundleDisplayName: Tummi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.antonpenkov.tummi
            CFBundleURLSchemes:
              - tummi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antonpenkov.tummi
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3UHRLQ9522
        CODE_SIGN_ENTITLEMENTS: Tummi/Tummi.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
  TummiWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TummiWidget
      - path: Tummi/Core/WidgetShared.swift
      # An extension looks strings up in its own bundle, so the catalogue is compiled into
      # both targets rather than duplicated as a second file to keep in step.
      - path: Tummi/Localizable.xcstrings
    info:
      path: TummiWidget/Info.plist
      properties:
        CFBundleDisplayName: Tummi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antonpenkov.tummi.widget
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3UHRLQ9522
        CODE_SIGN_ENTITLEMENTS: TummiWidget/TummiWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SKIP_INSTALL: YES
  TummiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TummiTests
    dependencies:
      - target: Tummi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antonpenkov.tummi.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
  TummiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TummiUITests
    dependencies:
      - target: Tummi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antonpenkov.tummi.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        TEST_TARGET_NAME: Tummi
