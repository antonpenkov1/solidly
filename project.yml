name: Tummi
options:
  bundleIdPrefix: com.antonpenkov
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_EMIT_LOC_STRINGS: YES
schemes:
  Tummi:
    build:
      targets:
        Tummi: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TummiTests
        - TummiUITests
    archive:
      config: Release
targets:
  Tummi:
    type: application
    platform: iOS
    sources:
      - Tummi
      # Liquid Glass icon (iOS 26+). The icon compiler also derives the legacy flat sizes
      # from these layers, so AppIcon.appiconset is gone rather than duplicated.
      - path: AppIcon.icon
    dependencies:
      - target: TummiWidget
    info:
      path: Tummi/Info.plist
      properties:
        CFBundleDisplayName: Solidly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # Required at the TOP level or App Store Connect rejects the upload with ITMS-90713.
        # actool writes it only nested inside CFBundleIcons when the icon comes from a
        # layered .icon bundle, so it has to be stated here.
        CFBundleIconName: AppIcon
        # A branded launch screen rather than a white flash. The colour asset has a dark
        # variant, so cold start matches the appearance the app is about to draw.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad gets all four: a tablet locked to portrait feels broken, and multitasking
        # expects an app to rotate. The layout is a single readable column either way.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.antonpenkov.tummi
            CFBundleURLSchemes:
              - tummi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antonpenkov.tummi
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3UHRLQ9522
        CODE_SIGN_ENTITLEMENTS: Tummi/Tummi.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
  TummiWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TummiWidget
      - path: Tummi/Core/WidgetShared.swift
      # An extension looks strings up in its own bundle, so the catalogue is compiled into
      # both targets rather than duplicated as a second file to keep in step.
      - path: Tummi/Localizable.xcstrings
    info:
      path: TummiWidget/Info.plist
      properties:
        CFBundleDisplayName: Solidly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antonpenkov.tummi.widget
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3UHRLQ9522
        CODE_SIGN_ENTITLEMENTS: TummiWidget/TummiWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SKIP_INSTALL: YES
  TummiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TummiTests
    dependencies:
      - target: Tummi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antonpenkov.tummi.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
  TummiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TummiUITests
    dependencies:
      - target: Tummi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antonpenkov.tummi.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        TEST_TARGET_NAME: Tummi
